name: api-analyser

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-analyser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-api_analyser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_analyser_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-api_analyser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api_analyser} -d ${POSTGRES_DB:-api_analyser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-analyser-network

  redis:
    image: redis:7-alpine
    container_name: api-analyser-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-api_analyser_redis_dev}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-api_analyser_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-analyser-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: api-analyser-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Fixed, not ${API_PORT}. The published mapping below is `API_PORT:4000`,
      # so the container must always listen on 4000 — feeding API_PORT in here
      # made the process bind the *host* port number inside the container, and
      # any API_PORT other than the default left nothing behind the mapping.
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-api_analyser}:${POSTGRES_PASSWORD:-api_analyser_dev_password}@postgres:5432/${POSTGRES_DB:-api_analyser}
      REDIS_URL: redis://:${REDIS_PASSWORD:-api_analyser_redis_dev}@redis:6379
      # Left empty on purpose. These four have no safe default: the API refuses
      # to boot on a placeholder secret, and shipping a real-looking one in a
      # public compose file would mean every install shared the key that
      # encrypts its stored target credentials. The entrypoint generates them on
      # first boot and persists them on the api_secrets volume; set them here or
      # in .env to use your own instead.
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-3}
      # Logs and notifications. These are DEFAULTS — an administrator overrides
      # them at runtime from Settings, and the override lives in the database,
      # so a container restart does not undo it. The retention job runs on the
      # BullMQ queue that Redis already backs; no extra service is needed, and
      # adding an `api` replica would not run it twice.
      LOG_COLLECTION_ENABLED: ${LOG_COLLECTION_ENABLED:-true}
      LOG_LIVE_STREAM_ENABLED: ${LOG_LIVE_STREAM_ENABLED:-true}
      LOG_RETENTION_ENABLED: ${LOG_RETENTION_ENABLED:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_MAX_RECORDS: ${LOG_MAX_RECORDS:-500000}
      LOG_CLEANUP_INTERVAL_HOURS: ${LOG_CLEANUP_INTERVAL_HOURS:-24}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      NOTIFICATIONS_RETENTION_DAYS: ${NOTIFICATIONS_RETENTION_DAYS:-90}
      REPORTS_DIR: /app/reports
      # Outbound email, via Resend. Optional: with no key the API boots, logs
      # that email is disabled and records every send as SKIPPED — in-app
      # notifications are unaffected.
      #
      # The `reports` and `email` queues are consumed by this service, alongside
      # `scanner` and the log-retention queue. There is deliberately no separate
      # worker container: BullMQ workers are registered by the same Nest process
      # that registers the queues, so one `api` service processes everything and
      # there is no way to end up running two copies of a worker by accident.
      # Scaling `api` would scale the workers with it, which is the intended
      # behaviour — the queues are the coordination point.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-API Analyzer}
      # Links inside emails. Falls back to FRONTEND_URL, which is already set
      # above, so this only needs setting when the two differ.
      APP_URL: ${APP_URL:-}
      EMAIL_MAX_ATTACHMENT_BYTES: ${EMAIL_MAX_ATTACHMENT_BYTES:-8388608}
      DOCKER_ENV: "true"
      # Required for the localhost → host.docker.internal rewrite to be usable:
      # host-gateway resolves to a private IP, so the SSRF check rejects it
      # unless private targets are allowed. Set false for hosted deployments.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      # The administrator created on the very first boot, when the user table is
      # empty. Change these BEFORE the first `up` if you do not want the
      # published defaults; changing them afterwards does nothing, because the
      # bootstrap only ever runs against an empty database.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@apianalyser.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - ./apps/api/nest-cli.json:/app/nest-cli.json
      - ./apps/api/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - api_reports:/app/reports
      - api_secrets:/app/.secrets
    networks:
      - api-analyser-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: api-analyser-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-API Analyser}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    networks:
      - api-analyser-network

  # Optional: Metrics & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: api-analyser-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - api-analyser-network

  grafana:
    image: grafana/grafana:latest
    container_name: api-analyser-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - api-analyser-network

volumes:
  postgres_data:
  redis_data:
  api_reports:
  api_secrets:
  prometheus_data:
  grafana_data:

networks:
  api-analyser-network:
    driver: bridge

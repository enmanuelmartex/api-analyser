name: api-analyser

# Full-build / production-like stack — this is what `docker compose up` runs
# by default. Every image is built from its Dockerfile's `production` stage:
# the API runs compiled `dist/main.js` (no `nest start --watch`), and the web
# app runs Next.js's standalone server against an already-`next build`-ed
# `.next` (no `next dev`, no on-demand per-route compilation while navigating).
#
# For active development with hot reload, layer the dev override on top:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# See docker-compose.dev.yml for what that changes and why.

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-analyser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-api_analyser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_analyser_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-api_analyser}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api_analyser} -d ${POSTGRES_DB:-api_analyser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-analyser-network

  redis:
    image: redis:7-alpine
    container_name: api-analyser-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-api_analyser_redis_dev}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-api_analyser_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-analyser-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: api-analyser-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Hardcoded, not ${NODE_ENV:-production}: the root .env ships
      # NODE_ENV=development for the from-source (`bun run dev`) path, and
      # Compose auto-loads that file for variable substitution. A default of
      # "production" that a leftover .env value could silently override
      # defeats the entire point of this file being the full-build/production
      # stack — target: production above already committed to that, and
      # NODE_ENV must follow deterministically from which compose files are
      # layered, not from an unrelated variable. docker-compose.dev.yml sets
      # this to "development" explicitly.
      NODE_ENV: production
      # Fixed, not ${API_PORT}. The published mapping below is `API_PORT:4000`,
      # so the container must always listen on 4000 — feeding API_PORT in here
      # made the process bind the *host* port number inside the container, and
      # any API_PORT other than the default left nothing behind the mapping.
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-api_analyser}:${POSTGRES_PASSWORD:-api_analyser_dev_password}@postgres:5432/${POSTGRES_DB:-api_analyser}
      REDIS_URL: redis://:${REDIS_PASSWORD:-api_analyser_redis_dev}@redis:6379
      # Left empty on purpose. These four have no safe default: the API refuses
      # to boot on a placeholder secret, and shipping a real-looking one in a
      # public compose file would mean every install shared the key that
      # encrypts its stored target credentials. The entrypoint generates them on
      # first boot and persists them on the api_secrets volume; set them here or
      # in .env to use your own instead.
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-3}
      REPORTS_DIR: /app/reports
      DOCKER_ENV: "true"
      # Required for the localhost → host.docker.internal rewrite to be usable:
      # host-gateway resolves to a private IP, so the SSRF check rejects it
      # unless private targets are allowed. Set false for hosted deployments.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      # The administrator created on the very first boot, when the user table is
      # empty. Change these BEFORE the first `up` if you do not want the
      # published defaults; changing them afterwards does nothing, because the
      # bootstrap only ever runs against an empty database.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@apianalyser.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-4000}:4000"
    # No source bind mounts here on purpose: the production image's `dist/` is
    # what actually runs, and mounting `./apps/api/src` over it would either do
    # nothing (dist is a separate compiled tree) or, worse, mask the build with
    # host state. Only the two things that must outlive a container replace —
    # generated report artifacts and the generated-secrets file — are mounted.
    volumes:
      - api_reports:/app/reports
      - api_secrets:/app/.secrets
    networks:
      - api-analyser-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        # NEXT_PUBLIC_* variables are inlined into the client JS bundle at
        # `next build` time, which happens during this image build — setting
        # them only as runtime `environment:` (below) would be too late; the
        # browser bundle would already have baked in whatever was present (or
        # absent) when this image was built. This MUST be a URL the browser
        # itself can reach (e.g. the published host port), never an
        # in-network hostname like `http://api:4000` — the browser is not a
        # party to the `api-analyser-network` Docker network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-API Analyser}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
    container_name: api-analyser-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Also set at runtime: next.config.ts reads NEXT_PUBLIC_API_URL again
      # when the standalone server boots (for its `/api/*` rewrite target).
      # Keep this equal to the build arg above.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-API Analyser}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # No source bind mounts: the standalone server copied into the image is a
    # self-contained, already-built app — there is no `src/` in this stage for
    # a mount to shadow, and mounting the host's `apps/web/src` here would just
    # sit next to it unused.
    networks:
      - api-analyser-network

  # Optional: Metrics & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: api-analyser-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - api-analyser-network

  grafana:
    image: grafana/grafana:latest
    container_name: api-analyser-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - api-analyser-network

volumes:
  postgres_data:
  redis_data:
  api_reports:
  api_secrets:
  prometheus_data:
  grafana_data:

networks:
  api-analyser-network:
    driver: bridge
